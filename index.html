<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pool Control</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-primary: #0f1923;
      --bg-secondary: #1a2836;
      --bg-card: #1e3044;
      --bg-card-hover: #243a50;
      --bg-surface: #25405c;
      --text-primary: #e8edf2;
      --text-secondary: #8a9bb5;
      --text-muted: #5a7088;
      --accent: #00b4d8;
      --accent-glow: rgba(0, 180, 216, 0.25);
      --green: #2ecc71;
      --green-glow: rgba(46, 204, 113, 0.2);
      --red: #e74c3c;
      --red-glow: rgba(231, 76, 60, 0.2);
      --orange: #f39c12;
      --border: rgba(255, 255, 255, 0.06);
      --border-active: rgba(0, 180, 216, 0.4);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.3);
      --shadow-card-hover: 0 8px 32px rgba(0, 0, 0, 0.4);
      --transition-fast: 0.15s ease;
      --transition-med: 0.25s ease;
      --transition-slow: 0.4s ease;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px 32px;
      background: radial-gradient(ellipse at top, rgba(0, 180, 216, 0.04) 0%, transparent 60%);
    }

    /* ── App Shell ── */
    .app-shell {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 28px;
      background: var(--bg-secondary);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
    }

    .header-brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .header-title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent), #00e5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 500;
    }

    .header-stats {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .header-stat {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }

    .header-stat-value {
      font-size: 1.35rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .header-stat-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .text-ok { color: var(--green); }
    .text-err { color: var(--red); }

    /* ── Bodies Grid ── */
    .bodies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 24px;
    }

    /* ── Body Card ── */
    .body-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
      transition: box-shadow var(--transition-med), border-color var(--transition-med);
      position: relative;
      overflow: hidden;
    }

    .body-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), transparent);
      opacity: 0;
      transition: opacity var(--transition-med);
    }

    .body-card:hover {
      border-color: var(--border-active);
      box-shadow: var(--shadow-card-hover);
    }

    .body-card:hover::before {
      opacity: 1;
    }

    .body-card.heating {
      border-color: rgba(0, 180, 216, 0.15);
    }

    .body-card.heating::before {
      background: linear-gradient(90deg, var(--accent), var(--green));
      opacity: 1;
    }

    /* ── Body Card Header ── */
    .body-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .body-icon {
      font-size: 2.2rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .body-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .body-name {
      font-size: 1.35rem;
      font-weight: 600;
      margin: 0;
      color: var(--text-primary);
    }

    .body-temp-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .body-temp-value {
      font-size: 2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
      line-height: 1;
    }

    .body-temp-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ── Status Pills ── */
    .body-status {
      flex-shrink: 0;
    }

    .status-pill {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .status-heating {
      background: var(--green-glow);
      color: var(--green);
      border: 1px solid rgba(46, 204, 113, 0.3);
      animation: pulse-green 2s ease-in-out infinite;
    }

    .status-idle {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    @keyframes pulse-green {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* ── Circuits Section ── */
    .circuits-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }

    .circuits-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .circuit-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
      border: 1px solid transparent;
      user-select: none;
      min-width: 100px;
    }

    .circuit-toggle:hover {
      background: rgba(0, 0, 0, 0.35);
      border-color: var(--border);
    }

    .circuit-toggle.active {
      background: rgba(0, 180, 216, 0.08);
      border-color: var(--border-active);
    }

    .circuit-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ── Toggle Switch ── */
    .toggle-switch {
      width: 42px;
      height: 24px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      position: relative;
      display: flex;
      align-items: center;
      padding: 2px;
      transition: background var(--transition-med);
      flex-shrink: 0;
    }

    .toggle-switch.active {
      background: var(--accent);
    }

    .toggle-knob {
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      left: 2px;
      transition: transform var(--transition-med);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    .toggle-switch.active .toggle-knob {
      transform: translateX(18px);
    }

    .circuit-name {
      flex: 1;
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .circuit-toggle.active .circuit-name {
      color: var(--text-primary);
    }

    /* ── Heater Section ── */
    .heater-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .heat-mode-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
      gap: 8px;
    }

    .heat-mode-btn {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: rgba(0, 0, 0, 0.2);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all var(--transition-fast);
      text-align: center;
    }

    .heat-mode-btn:hover {
      background: rgba(0, 0, 0, 0.35);
      border-color: var(--border-active);
      color: var(--text-primary);
    }

    .heat-mode-btn.active {
      background: rgba(0, 180, 216, 0.12);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* ── Heater Controls ── */
    .heater-controls {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .temp-btn {
      width: 44px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 1.15rem;
      font-weight: 600;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .temp-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      transform: scale(1.05);
    }

    .temp-btn:active {
      transform: scale(0.95);
    }

    .temp-setpoint {
      font-size: 1.4rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
      min-width: 70px;
      text-align: center;
    }

    .temp-slider {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: var(--bg-surface);
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      outline: none;
    }

    .temp-slider::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid var(--bg-primary);
      box-shadow: 0 0 8px var(--accent-glow);
      transition: transform var(--transition-fast);
    }

    .temp-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .temp-slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid var(--bg-primary);
    }

    .temp-slider:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .heater-mode-display {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }

    .heater-mode-display strong {
      color: var(--accent);
    }

    /* ── Status Views ── */
    .status-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 20px;
      padding: 40px;
    }

    .status-message {
      font-size: 1.1rem;
      color: var(--text-secondary);
      text-align: center;
      max-width: 400px;
    }

    /* ── Spinner ── */
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Error View ── */
    .status-view.error {
      color: var(--red);
    }

    .error-icon {
      font-size: 3rem;
      opacity: 0.6;
    }

    .retry-btn {
      padding: 12px 32px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .retry-btn:hover {
      background: #00a8cc;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    /* ── Light Controls ── */
    .light-control-panel {
      background: rgba(0, 0, 0, 0.2);
      border-radius: var(--radius-md);
      padding: 20px;
      border: 1px solid var(--border);
    }

    .light-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .light-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0;
    }

    .light-header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .light-btn {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all var(--transition-fast);
      white-space: nowrap;
    }

    .light-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .light-btn.active {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    .light-section {
      margin-top: 20px;
    }

    .light-section-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 12px 0;
    }

    .light-btn-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .intellibrite-btn {
      padding: 10px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all var(--transition-fast);
    }

    .intellibrite-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .light-color-grid {
      display: flex;
      gap: 12px;
    }

    .light-color-fab {
      width: 48px;
      height: 48px;
      border: 2px solid var(--border);
      border-radius: 50%;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .light-color-fab:hover {
      transform: scale(1.15);
      border-color: var(--accent);
      box-shadow: 0 4px 16px rgba(0, 180, 216, 0.4);
    }

    .light-color-fab:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ── Disabled Section ── */
    .disabled-section {
      opacity: 0.5;
    }

    .circuit-toggle.disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .circuit-toggle.disabled:hover {
      background: rgba(0, 0, 0, 0.2);
      border-color: transparent;
    }

    .toggle-switch.disabled {
      background: rgba(255, 255, 255, 0.05);
    }

    .toggle-switch.disabled.active {
      background: rgba(255, 255, 255, 0.1);
    }

    .circuit-name.disabled {
      color: var(--text-muted);
    }

    .disabled-badge {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      background: var(--red-glow);
      color: var(--red);
      border-radius: 10px;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .off-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--bg-surface);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
    }

    .off-btn:hover {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
      transform: scale(1.1);
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      #root { padding: 16px; }
      .header {
        flex-direction: column;
        gap: 16px;
        padding: 20px;
      }
      .header-stats { align-self: flex-start; }
      .bodies-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .bodies-grid {
        grid-template-columns: 1fr;
      }
      .body-card {
        padding: 20px;
      }
      .circuits-list {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./node_modules/react/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="./node_modules/react-dom/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <script src="renderer.js"></script>
</body>
</html>
