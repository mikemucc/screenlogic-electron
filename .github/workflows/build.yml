name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate preload script
        run: npm run generate-preload

      - name: Run tests
        run: npm test

  build:
    name: Build (${{ matrix.os }})
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate preload script
        run: npm run generate-preload

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run package -- --mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run package -- --win

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run package -- --linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: screenlogic-electron-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.snap
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: ignore